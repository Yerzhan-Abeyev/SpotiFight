<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiFight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script>if(localStorage.getItem('dc_theme')==='light')document.documentElement.classList.add('light');</script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(29,185,84,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(29,185,84,0.025) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        .card { background: linear-gradient(145deg,#181818,#111); border: 1px solid rgba(255,255,255,0.06); }

        #word-display {
            font-family: 'Bebas Neue', sans-serif; font-size: 4.5rem;
            letter-spacing: 0.12em; line-height: 1;
            background: linear-gradient(135deg,#1DB954,#17a349);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        #timer-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#1DB954,#17a349); }

        .search-input {
            background: #1a1a1a; border: 1.5px solid rgba(255,255,255,0.08); color: #fff;
            border-radius: 12px; padding: 14px 18px; width: 100%; font-size: 0.95rem;
            outline: none; transition: border-color 0.2s; font-family: 'Inter', sans-serif;
        }
        .search-input:focus { border-color: #1DB954; }
        .search-input::placeholder { color: #444; }

        .results-window { max-height: 290px; overflow-y: auto; background: #111; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .results-window::-webkit-scrollbar { width: 5px; }
        .results-window::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }

        .song-item { display: flex; align-items: center; gap: 14px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
        .song-item:last-child { border-bottom: none; }
        .song-item:hover { background: #1c1c1c; }
        .song-item img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .song-placeholder { width: 46px; height: 46px; border-radius: 6px; background: #222; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .song-title { font-weight: 600; font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.75rem; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Checking box */
        #checking-box {
            width: 100%; padding: 14px 16px; border-radius: 14px;
            background: #111; border: 1.5px solid #222;
            display: none; align-items: center; gap: 12px;
        }
        #checking-box img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .ck-info { flex: 1; min-width: 0; }
        .ck-title { font-weight: 600; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ck-status { font-size: 0.73rem; color: #555; margin-top: 3px; }
        .ck-status span { animation: bounce 0.9s infinite ease-in-out; display: inline-block; }
        .ck-status span:nth-child(2) { animation-delay: .15s; }
        .ck-status span:nth-child(3) { animation-delay: .3s; }

        /* Feedback */
        .feedback-box { width: 100%; padding: 18px 20px; border-radius: 14px; font-size: 1rem; font-weight: 600; text-align: center; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes popIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
        .fb-win  { background: #0c2418; border: 1.5px solid #1DB954; color: #1DB954; }
        .fb-lose { background: #2b0d0d; border: 1.5px solid #ff4444; color: #ff5555; }
        .fb-warn { background: #1e1a0a; border: 1.5px solid #f59e0b; color: #f59e0b; }

        #start-btn {
            background: #1DB954; color: #000; font-weight: 700; font-size: 0.95rem;
            padding: 14px 44px; border-radius: 999px; border: none; cursor: pointer;
            letter-spacing: 0.04em; transition: transform 0.15s, box-shadow 0.2s; font-family: 'Inter', sans-serif;
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 28px rgba(29,185,84,0.35); }

        .dot-loader { display: flex; gap: 6px; justify-content: center; padding: 22px; }
        .dot-loader span { width: 7px; height: 7px; background: #1DB954; border-radius: 50%; animation: bounce 1s infinite ease-in-out; }
        .dot-loader span:nth-child(2) { animation-delay: .15s; }
        .dot-loader span:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        .empty-state { padding: 28px; text-align: center; color: #444; font-size: 0.82rem; }
        .back-link { font-size: 0.72rem; color: #333; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; transition: color 0.15s; }
        .back-link:hover { color: #666; }
        .stat-label { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em; font-size: 0.8rem; color: #444; }
        .stat-val   { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.06em; font-size: 1.15rem; }
        .note { font-size: 0.72rem; color: #2a2a2a; text-align: center; }
        .stat-divider { width: 1px; background: #222; height: 28px; }

        /* Difficulty badges */
        .diff-badge { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em; font-size: 0.8rem; padding: 2px 10px; border-radius: 999px; }
        .diff-easy   { background: #0c2418; color: #1DB954; border: 1px solid #1DB954; }
        .diff-medium { background: #1e1208; color: #f59e0b; border: 1px solid #f59e0b; }
        .diff-hard   { background: #2b0d0d; color: #ff5555; border: 1px solid #ff5555; }

        /* ── Page exit transition ── */
        body { transition: opacity 0.28s ease, transform 0.28s ease; transform-origin: center top; }
        body.page-exit { opacity: 0; transform: scale(0.97) translateY(-8px); }

        /* ── Page entrance animation ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0);    }
        }
        #page-header { animation: fadeUp 0.35s cubic-bezier(0.22,1,0.36,1) both; }
        .card        { animation: fadeUp 0.45s 0.06s cubic-bezier(0.22,1,0.36,1) both; }

        /* Word container difficulty tint on hard */
        #word-display.hard {
            background: linear-gradient(135deg,#ff5555,#cc2222);
            -webkit-background-clip: text; background-clip: text;
        }
        #word-display.medium {
            background: linear-gradient(135deg,#f59e0b,#d97706);
            -webkit-background-clip: text; background-clip: text;
        }

        /* Game over */
        .go-title { font-family: 'Bebas Neue', sans-serif; font-size: 3.8rem; color: #ff4444; letter-spacing: 0.12em; line-height: 1; }
        .go-score { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 0.08em; color: #fff; }

        /* ── Mobile ── */
        @media (max-width: 480px) {
            body { padding: 12px !important; }
            .card { padding: 20px !important; }
            #word-display { font-size: 3.2rem; }
            .go-title { font-size: 2.8rem; }
            .go-score { font-size: 2rem; }
            #start-btn { padding: 13px 32px; font-size: 0.9rem; }
            .search-input { padding: 12px 14px; font-size: 0.9rem; }
            .btn-icon { display: none; }
        }

        /* ── Leaderboard layout ── */
        .lb-layout { position: relative; width: 100%; max-width: 576px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .lb-game-col { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .lb-panel { display: none; position: absolute; right: calc(100% + 64px); top: 0; width: 300px; }
        @media (min-width: 1000px) {
            .lb-panel.visible { display: block; }
        }
        .lb-card { background: linear-gradient(145deg,#181818,#111); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; width: 100%; }
        .lb-title { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #1DB954; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .lb-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; margin-bottom: 2px; }
        .lb-row.lb-me { background: rgba(29,185,84,0.1); border: 1px solid rgba(29,185,84,0.2); }
        .lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; color: #333; width: 20px; text-align: center; flex-shrink: 0; }
        .lb-row.lb-me .lb-rank { color: #1DB954; }
        .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #777; font-size: 0.78rem; }
        .lb-row.lb-me .lb-name { color: #fff; font-weight: 600; }
        .lb-score-val { font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; color: #444; flex-shrink: 0; }
        .lb-row.lb-me .lb-score-val { color: #1DB954; }
        .lb-separator { height: 1px; background: rgba(255,255,255,0.05); margin: 6px 0; }
        .lb-empty { color: #333; font-size: 0.75rem; text-align: center; padding: 20px 0; line-height: 1.6; }
        .lb-loading { color: #333; font-size: 0.75rem; text-align: center; padding: 20px 0; }
    </style>
</head>

<script>
// WORD BANKS
// Easy: very common single-form words that appear across all mainstream genres
const WORDS_EASY = [
    // Body & feeling
    'love','heart','soul','mind','eyes','tears','voice','smile','kiss','hands',
    'arms','lips','body','breath','skin','blood','head','chest','face','touch',
    'pain','hurt','fear','hope','dream','feel','cry','miss',
    // Emotions & states
    'happy','sad','lost','broken','alive','alone','free','strong','wild',
    'real','true','wrong','right','cold','warm','young','old','sweet','soft',
    'hard','deep','high','low','slow','fast','good','bad','safe','bright',
    // People
    'girl','boy','baby','friend','angel','mother','father','king','queen',
    'woman','man','lover','brother','sister','hero','soldier',
    // Nature & place
    'night','day','life','time','home','world','road','sky','sun','moon',
    'stars','rain','fire','light','dark','storm','ocean','river',
    'door','city','street','room','wall','bed','earth','sea','air',
    'water','wind','town','place','smoke','snow','blood',
    // Colors
    'black','white','blue','red','gold','silver','green',
    // Actions
    'run','fall','fly','rise','dance','fight','hold','break','leave','find',
    'come','walk','lose','move','save','burn','stay','give','take','play',
    'shine','fade','hide','wait','stop','scream','sing','speak','laugh','know',
    'call','keep','think','pray','wish','hear','tell','show','turn','stand',
    'look','open','close','forget','remember','believe','see','say','want','need',
    // Common song words
    'song','name','way','back','away','tonight','forever','better','never','always',
    'still','together','again','money','summer','winter','morning','midnight',
    'music','beat','party','memory','chance','truth','lie','war','peace',
    'promise','word','crazy','beautiful','perfect','change','down','long',
];

// Medium (100): appear in lyrics but need a specific song in mind
const WORDS_MEDIUM = [
    'ghost',   'hollow',  'echo',    'shadow',  'thunder', 'survive', 'rebel',   'whisper', 'wander',  'collide',
    'drown',   'bleed',   'crawl',   'surrender','reckless','restless','haunt',   'shatter', 'crumble', 'spiral',
    'ignite',  'stone',   'steel',   'crown',   'kingdom', 'warrior', 'battle',  'storm',   'cage',    'mercy',
    'glory',   'sacrifice','devoted','wasted',  'scattered','stranded','trapped', 'escape',  'vanish',  'stumble',
    'linger',  'suffer',  'ache',    'hunger',  'rage',    'grief',   'guilt',   'doubt',   'faith',   'grace',
    'chaos',   'power',   'shelter', 'burden',  'mirror',  'poison',  'anchor',  'ember',   'spark',   'venom',
    'sorrow',  'stain',   'blade',   'throne',  'grave',   'dust',    'ash',     'smoke',   'fever',   'faded',
    'haunted', 'sacred',  'selfish', 'fragile', 'violent', 'endless', 'ruthless','demons',  'shadows', 'storms',
    'battles', 'warriors','kingdoms','chains',  'wings',   'flames',  'scars',   'wounds',  'blades',  'thrones',
    'graves',  'embers',  'sparks',  'sorrows', 'burdens', 'mirrors', 'anchors', 'whispers','echoes',  'ghosts',
];

// Hard (20): uncommon words that still appear in real songs
const WORDS_HARD = [
    'melancholy', 'labyrinth',  'vendetta',   'paradox',    'silhouette',
    'oblivion',   'tempest',    'asylum',     'exodus',     'requiem',
    'redemption', 'purgatory',  'solitude',   'euphoria',   'nostalgia',
    'adrenaline', 'catastrophe','revelation', 'renaissance','apocalypse',
];

// ── CONFIG ────────────────────────────────────────────────────────────────────
const TIME_LIMIT    = 30;
const STREAK_MEDIUM = 7;
const STREAK_HARD   = 12;
const SCORE_CONFIG = {
    easy:   { base: 100, timeBonus: 2  },   // max 160 pts
    medium: { base: 250, timeBonus: 5  },   // max 400 pts
    hard:   { base: 500, timeBonus: 10 },   // max 800 pts
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentWord    = '';
let roundActive    = false;
let currentAudio   = null;
let currentAudioCtx = null;
let roundStartedAt = null;
let pauseStart     = null;   // tracks when timer was paused (for no-lyrics retry)
let timerRAF       = null;
let searchDebounce = null;
let score          = 0;
let streak         = 0;

// Shuffled decks — one per tier, refilled when exhausted
let decks   = { easy: [], medium: [], hard: [] };
let deckPtr = { easy: 0,  medium: 0,  hard: 0  };

// ── DIFFICULTY ────────────────────────────────────────────────────────────────
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function initDecks() {
    decks   = { easy: shuffle(WORDS_EASY), medium: shuffle(WORDS_MEDIUM), hard: shuffle(WORDS_HARD) };
    deckPtr = { easy: 0, medium: 0, hard: 0 };
}

function getDifficulty() {
    if (streak >= STREAK_HARD)   return 'hard';
    if (streak >= STREAK_MEDIUM) return 'medium';
    return 'easy';
}

function pickWord() {
    const diff = getDifficulty();
    // Refill and reshuffle when the deck for this tier runs out
    if (deckPtr[diff] >= decks[diff].length) {
        const src = diff === 'hard' ? WORDS_HARD : diff === 'medium' ? WORDS_MEDIUM : WORDS_EASY;
        decks[diff]  = shuffle(src);
        deckPtr[diff] = 0;
    }
    return decks[diff][deckPtr[diff]++];
}

function updateDiffBadge() {
    const diff  = getDifficulty();
    const badge = document.getElementById('diff-badge');
    badge.className = `diff-badge diff-${diff}`;
    badge.innerText = diff.toUpperCase();

    const wd = document.getElementById('word-display');
    wd.className = diff;   // easy / medium / hard — drives CSS gradient
}

// ── DEEZER SEARCH ─────────────────────────────────────────────────────────────
function normalizeDeezerTrack(t) {
    return {
        name:       t.title,
        artists:    [{ name: t.artist.name, id: t.artist.id }],
        album:      { images: [
            { url: t.album.cover_big    || '' },
            { url: t.album.cover_medium || '' },
            { url: t.album.cover_small  || '' },
        ]},
        preview_url: t.preview || null,
    };
}

async function searchDeezer(query) {
    const res = await fetch(`/api/deezer/search?q=${encodeURIComponent(query)}&limit=8`);
    if (!res.ok) throw new Error(`Search error: ${res.status}`);
    return (await res.json()).map(normalizeDeezerTrack);
}

// ── LYRICS ────────────────────────────────────────────────────────────────────
async function fetchLyrics(trackName, artist) {
    const cleanTitle  = trackName.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
    const cleanArtist = artist.split(',')[0].trim();

    // 1. lyrics.ovh
    try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 1500);
        const res = await fetch(
            `https://api.lyrics.ovh/v1/${encodeURIComponent(cleanArtist)}/${encodeURIComponent(cleanTitle)}`,
            { signal: ctrl.signal }
        );
        clearTimeout(t);
        if (res.ok) {
            const data = await res.json();
            if (data.lyrics) return data.lyrics;
        }
    } catch { /* fall through */ }

    // 2. lrclib.net
    try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 1500);
        const res = await fetch(
            `https://lrclib.net/api/get?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanTitle)}`,
            { signal: ctrl.signal }
        );
        clearTimeout(t);
        if (res.ok) {
            const data = await res.json();
            if (data.plainLyrics) return data.plainLyrics;
        }
    } catch { /* fall through */ }

    return null;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function wordInText(word, text) {
    const re = new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
    return re.test(text);
}

function hide(id)     { document.getElementById(id).style.display = 'none'; }
function esc(s)       { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── AUDIO PREVIEW ─────────────────────────────────────────────────────────────
function stopAudio() {
    if (currentAudio)    { currentAudio.pause(); currentAudio = null; }
    if (currentAudioCtx) { currentAudioCtx.close().catch(()=>{}); currentAudioCtx = null; }
}

async function playPreview(track) {
    const vol = parseInt(localStorage.getItem('dc_volume') ?? '70') / 100;
    if (vol === 0) return;
    stopAudio();
    let url = track.preview_url || null;
    if (!url) {
        try {
            const q   = `${track.name} ${track.artists.map(a => a.name).join(' ')}`;
            const res = await fetch(`/api/deezer/preview?q=${encodeURIComponent(q)}`);
            url = (await res.json()).preview || null;
        } catch { url = null; }
    }
    if (!url) return;

    const dur     = 9000 + Math.random() * 1000; // 9–10s
    const maxVol  = parseInt(localStorage.getItem('dc_volume') ?? '70') / 100;
    const fadeIn  = 1500;
    const fadeOut = 1500;

    // Radio static via Web Audio API (no crossOrigin needed)
    try {
        const ctx = new AudioContext();
        currentAudioCtx = ctx;
        const nBuf  = ctx.createBuffer(1, ctx.sampleRate * 1.4, ctx.sampleRate);
        const nData = nBuf.getChannelData(0);
        for (let i = 0; i < nData.length; i++) nData[i] = (Math.random() * 2 - 1) * 0.12;
        const nSrc  = ctx.createBufferSource();
        nSrc.buffer = nBuf;
        const nGain = ctx.createGain();
        nGain.gain.setValueAtTime(maxVol, ctx.currentTime);
        nGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.4);
        nSrc.connect(nGain);
        nGain.connect(ctx.destination);
        nSrc.start();
    } catch(e) {}

    // Music with fade in / fade out
    const audio  = new Audio(url);
    currentAudio = audio;
    audio.volume = 0;
    audio.play().catch(() => {});

    const inSteps = 40, inInterval = fadeIn / inSteps;
    let inStep = 0;
    const fadeInId = setInterval(() => {
        if (currentAudio !== audio) { clearInterval(fadeInId); return; }
        inStep++;
        audio.volume = Math.min(maxVol, (inStep / inSteps) * maxVol);
        if (inStep >= inSteps) clearInterval(fadeInId);
    }, inInterval);

    setTimeout(() => {
        const outSteps = 40, outInterval = fadeOut / outSteps;
        let outStep = 0;
        const fadeOutId = setInterval(() => {
            if (currentAudio !== audio) { clearInterval(fadeOutId); return; }
            outStep++;
            audio.volume = Math.max(0, maxVol * (1 - outStep / outSteps));
            if (outStep >= outSteps) { clearInterval(fadeOutId); stopAudio(); }
        }, outInterval);
    }, dur - fadeOut);
}

// ── LEADERBOARD ───────────────────────────────────────────────────────────────
async function loadGlobalLeaderboard() {
    const listEl = document.getElementById('lb-global-list');
    if (!listEl) return;
    listEl.innerHTML = '<div class="lb-loading">Loading…</div>';

    const { data: top10 } = await sb
        .from('global_scores')
        .select('best_score, user_id, profiles(username)')
        .order('best_score', { ascending: false })
        .limit(10);

    if (!top10?.length) {
        listEl.innerHTML = '<div class="lb-empty">No scores yet.<br>Be the first!</div>';
        return;
    }

    const inTop10 = currentUser && top10.some(r => r.user_id === currentUser.id);
    let userExtra = null;

    if (currentUser && !inTop10) {
        const { data: mine } = await sb.from('global_scores')
            .select('best_score').eq('user_id', currentUser.id).maybeSingle();
        if (mine) {
            const { count } = await sb.from('global_scores')
                .select('*', { count: 'exact', head: true })
                .gt('best_score', mine.best_score);
            const { data: myProf } = await sb.from('profiles')
                .select('username').eq('id', currentUser.id).maybeSingle();
            userExtra = { rank: (count || 0) + 1, score: mine.best_score, username: myProf?.username || 'You' };
        }
    }

    let html = '';
    top10.forEach((row, i) => {
        const isMe = row.user_id === currentUser?.id;
        const name = row.profiles?.username || 'Anonymous';
        html += `<div class="lb-row${isMe ? ' lb-me' : ''}">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-name">${name}</span>
            <span class="lb-score-val">${row.best_score}</span>
        </div>`;
    });
    if (userExtra) {
        html += '<div class="lb-separator"></div>';
        html += `<div class="lb-row lb-me">
            <span class="lb-rank">${userExtra.rank}</span>
            <span class="lb-name">${userExtra.username}</span>
            <span class="lb-score-val">${userExtra.score}</span>
        </div>`;
    }
    listEl.innerHTML = html;
}

function showLb() { document.getElementById('lb-global').classList.add('visible'); }
function hideLb() { document.getElementById('lb-global').classList.remove('visible'); }

function startGame() {
    score  = 0;
    streak = 0;
    initDecks();
    document.getElementById('score-val').innerText  = '0';
    document.getElementById('streak-val').innerText = '0';
    document.getElementById('score-area').style.display = 'flex';
    document.getElementById('pre-game-stats').style.display = 'none';
    updateDiffBadge();
    hide('game-over-box');
    hide('pre-game');
    startRound();
}

function startRound() {
    stopAudio();
    currentWord    = pickWord();
    roundActive    = true;
    roundStartedAt = Date.now();
    pauseStart     = null;

    hide('feedback');
    hide('start-btn');
    hide('checking-box');
    hide('game-over-box');
    show('word-container');
    show('timer-container');
    showFlex('search-container');

    const wd = document.getElementById('word-display');
    wd.innerText = currentWord.toUpperCase();
    wd.className = getDifficulty();

    document.getElementById('search-bar').value          = '';
    document.getElementById('songs-list').innerHTML      = '';
    document.getElementById('empty-state').innerText     = '🎵 Start typing to search songs…';
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('loader-area').style.display = 'none';

    const bar = document.getElementById('timer-bar');
    bar.style.cssText = 'width:100%;height:100%;border-radius:999px;background:linear-gradient(90deg,#1DB954,#17a349);';

    document.getElementById('search-bar').focus();
    runTimer();
}

function runTimer() {
    cancelAnimationFrame(timerRAF);
    const bar  = document.getElementById('timer-bar');
    const text = document.getElementById('timer-text');

    function tick() {
        if (!roundActive) return;
        const elapsed   = (Date.now() - roundStartedAt) / 1000;
        const remaining = Math.max(0, TIME_LIMIT - elapsed);
        bar.style.width = `${(remaining / TIME_LIMIT) * 100}%`;
        text.innerText  = `${Math.ceil(remaining)}s`;
        if (remaining <= 5) bar.style.background = 'linear-gradient(90deg,#ff4444,#cc0000)';
        if (remaining <= 0) { roundActive = false; endRound('timeout', null); return; }
        timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function onSearchInput(val) {
    clearTimeout(searchDebounce);
    const q = val.trim();
    if (!q) {
        document.getElementById('songs-list').innerHTML      = '';
        document.getElementById('empty-state').innerText     = '🎵 Start typing to search songs…';
        document.getElementById('empty-state').style.display = 'block';
        document.getElementById('loader-area').style.display = 'none';
        return;
    }
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('loader-area').style.display = 'block';
    document.getElementById('songs-list').innerHTML      = '';

    searchDebounce = setTimeout(async () => {
        try {
            const tracks = await searchDeezer(q);
            document.getElementById('loader-area').style.display = 'none';
            renderResults(tracks);
        } catch {
            document.getElementById('loader-area').style.display = 'none';
            document.getElementById('empty-state').innerText     = 'Search failed. Try again.';
            document.getElementById('empty-state').style.display = 'block';
        }
    }, 350);
}

function renderResults(tracks) {
    const list = document.getElementById('songs-list');
    list.innerHTML = '';
    if (!tracks.length) {
        document.getElementById('empty-state').innerText     = 'No results found.';
        document.getElementById('empty-state').style.display = 'block';
        return;
    }
    tracks.forEach(track => {
        const art     = track.album?.images?.[2]?.url || track.album?.images?.[0]?.url || '';
        const artists = track.artists.map(a => a.name).join(', ');
        const li      = document.createElement('li');
        li.className  = 'song-item';
        li.innerHTML  = `
            ${art ? `<img src="${art}" alt="">` : `<div class="song-placeholder">🎵</div>`}
            <div style="min-width:0;flex:1;">
                <div class="song-title">${esc(track.name)}</div>
                <div class="song-artist">${esc(artists)}</div>
            </div>`;
        li.onclick = () => pickSong(track);
        list.appendChild(li);
    });
}

// ── PICK SONG ─────────────────────────────────────────────────────────────────
async function pickSong(track) {
    if (!roundActive) return;

    // Pause the timer while we check
    cancelAnimationFrame(timerRAF);
    timerRAF   = null;
    roundActive = false;
    pauseStart  = Date.now();

    hide('search-container');
    hide('timer-container');
    hide('word-container');

    const art = track.album?.images?.[1]?.url || track.album?.images?.[0]?.url || '';
    document.getElementById('ck-art').src         = art;
    document.getElementById('ck-title').innerText  = track.name;
    document.getElementById('ck-status').innerHTML = 'Checking lyrics<span>.</span><span>.</span><span>.</span>';
    document.getElementById('checking-box').style.display = 'flex';

    // Rule 1: word must NOT appear in the title
    if (wordInText(currentWord, track.name)) {
        hide('checking-box');
        endRound('word-in-title', track);
        return;
    }

    const trackName = track.name;
    const artist    = track.artists.map(a => a.name).join(', ');

    try {
        const lyrics = await fetchLyrics(trackName, artist);
        hide('checking-box');

        if (lyrics === null) {
            // No lyrics found — let player retry, resume timer where it left off
            endRound('no-lyrics', track);
            return;
        }

        // Compute remaining time (exclude time spent on the API call)
        const pausedDuration = Date.now() - pauseStart;
        roundStartedAt += pausedDuration;   // shift start so elapsed doesn't count paused time
        const elapsedSec   = (Date.now() - roundStartedAt) / 1000;
        const remainingSec = Math.max(0, TIME_LIMIT - elapsedSec);

        if (wordInText(currentWord, lyrics)) {
            // WIN
            const diff   = getDifficulty();
            const cfg    = SCORE_CONFIG[diff];
            const points = cfg.base + Math.floor(remainingSec * cfg.timeBonus);
            score  += points;
            streak += 1;
            document.getElementById('score-val').innerText  = score;
            document.getElementById('streak-val').innerText = streak;
            updateDiffBadge();
            endRound('win', track, points);
        } else {
            endRound('wrong', track);
        }

    } catch (e) {
        console.error(e);
        hide('checking-box');
        endRound('error', track);
    }
}

// ── END ROUND ─────────────────────────────────────────────────────────────────
function endRound(result, track, pointsEarned) {
    hide('search-container');
    hide('timer-container');
    hide('word-container');
    hide('checking-box');

    const fb   = document.getElementById('feedback');
    const name = track ? `&ldquo;${esc(track.name)}&rdquo;` : '';

    if (result === 'win') {
        fb.innerHTML = `<div class="feedback-box fb-win">
            ${name} has <strong>${currentWord}</strong> in its lyrics!
            <div style="font-size:0.78rem;font-weight:400;opacity:0.7;margin-top:4px;">+${pointsEarned} pts</div>
        </div>`;
        fb.style.display = 'block';
        playPreview(track);

        const btn     = document.getElementById('start-btn');
        btn.innerHTML = '<span class="btn-icon">&#9654;</span> Next Round';
        btn.onclick   = startRound;
        btn.style.display = 'block';

    } else if (result === 'word-in-title' || result === 'no-lyrics' || result === 'error') {
        const msg = result === 'word-in-title'
            ? `&ldquo;${currentWord}&rdquo; is in the song title. Pick a different song!`
            : result === 'no-lyrics'
            ? `Couldn&rsquo;t find lyrics for ${name}. Pick another song!`
            : `Lyrics lookup failed. Pick another song!`;
        fb.innerHTML = `<div class="feedback-box fb-warn">${msg}</div>`;
        fb.style.display = 'block';

        // Resume round with timer continuing from where it was
        setTimeout(() => {
            hide('feedback');
            // Adjust roundStartedAt to account for the display delay
            roundStartedAt += 1800;
            show('word-container');
            show('timer-container');
            showFlex('search-container');
            roundActive = true;
            runTimer();
            document.getElementById('search-bar').focus();
        }, 1800);

    } else {
        // GAME OVER: wrong or timeout
        let reasonHtml = '';
        if (result === 'wrong') {
            reasonHtml = `<div class="feedback-box fb-lose" style="margin-bottom:16px;">
                ${name} doesn&rsquo;t have <strong>${currentWord}</strong> in its lyrics.
            </div>`;
        } else if (result === 'timeout') {
            reasonHtml = `<div class="feedback-box fb-lose" style="margin-bottom:16px;">
                Time&rsquo;s up! The word was <strong>${currentWord}</strong>.
            </div>`;
        }

        fb.innerHTML     = reasonHtml;
        fb.style.display = 'block';

        showGameOver();
    }
}

    const diffLabel = diff.toUpperCase();

    if (isNewRecord) saveGlobalBest(score, streak);
    incrementGamesPlayed();
    updatePreGameStats();

        ? `<div style="font-size:0.7rem;color:#1DB954;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px;">New Record!</div>`
        : prev
        ? `<div style="font-size:0.72rem;color:#333;letter-spacing:0.08em;margin-bottom:6px;">Best: ${prev.score} pts</div>`
        : '';

    const box = document.getElementById('game-over-box');
